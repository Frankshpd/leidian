<!DOCTYPE html>

<head>

<body>
<canvas id="c"></canvas>
<script>
'use strict';
// ================== 基础设置 ==================
const W = 480, H = 720, SCROLL = 1.2;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let SC = 1;
function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H) || 1;
  const d = window.devicePixelRatio || 1;
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
  cv.width = Math.max(1, Math.round(W * s * d));
  cv.height = Math.max(1, Math.round(H * s * d));
  SC = cv.width / W;
}
addEventListener('resize', resize); resize();
const FONT = '"Microsoft YaHei","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Noto Serif CJK SC","WenQuanYi Micro Hei",sans-serif';
const PI = Math.PI, TAU = PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function hash(a, b) { let h = (a * 374761393 + b * 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }

// ================== 输入 ==================
const keys = {}; let pressed = {};
const PREVENT = new Set(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Period','Numpad2','KeyP','Quote']);
addEventListener('keydown', e => {
  Snd.init();
  if (locked) { e.preventDefault(); lockKey(e); return; }
  if (quiz && state === 'play') { e.preventDefault(); quizKey(e); return; }
  if (PREVENT.has(e.code)) e.preventDefault();
  if (!keys[e.code]) pressed[e.code] = true;
  keys[e.code] = true; Snd.init();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (state === 'play' && !quiz && !locked) paused = true; });
const CTRL = [
  { up:['KeyW'], down:['KeyS'], left:['KeyA'], right:['KeyD'], bomb:['KeyK'] },
  { up:['ArrowUp'], down:['ArrowDown'], left:['ArrowLeft'], right:['ArrowRight'], bomb:['Numpad2','Period'] }
];
const held = a => a.some(k => keys[k]);
const hit = a => a.some(k => pressed[k]);

// ================== 音效 (WebAudio) ==================
const Snd = {
  ac: null, master: null, last: {}, nb: null,
  init() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    try {
      this.ac = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ac.createGain(); this.master.gain.value = 0.22; this.master.connect(this.ac.destination);
    } catch (e) { this.ac = null; }
  },
  tone(f, dur, type = 'square', vol = .3, slide = 0, delay = 0) {
    const ac = this.ac; if (!ac) return;
    const t = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f * slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol = .5, freq = 800) {
    const ac = this.ac; if (!ac) return;
    if (!this.nb) { const len = ac.sampleRate; const b = ac.createBuffer(1, len, ac.sampleRate); const d = b.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1; this.nb = b; }
    const t = ac.currentTime, s = ac.createBufferSource(); s.buffer = this.nb;
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(freq, t); f.frequency.exponentialRampToValueAtTime(50, t + dur);
    const g = ac.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t); s.stop(t + Math.min(dur, 0.99));
  },
  play(n) {
    if (!this.ac) return;
    const now = performance.now(), gap = { shot: 75, laser: 75, hit: 45, boom: 40 }[n] || 0;
    if (gap && now - (this.last[n] || 0) < gap) return; this.last[n] = now;
    switch (n) {
      case 'shot': this.tone(900, .05, 'square', .04, .5); break;
      case 'laser': this.tone(1500, .06, 'sawtooth', .03, .6); break;
      case 'hit': this.tone(240, .03, 'square', .04); break;
      case 'ouch': this.tone(200, .12, 'sawtooth', .2, .5); break;
      case 'boom': this.noise(.35, .45, 1400); break;
      case 'big': this.noise(.95, .9, 2200); this.tone(90, .8, 'sawtooth', .3, .3); break;
      case 'item': this.tone(660, .08, 'triangle', .3); this.tone(990, .12, 'triangle', .3, 0, .07); break;
      case 'power': [523, 659, 784, 1047].forEach((f, i) => this.tone(f, .1, 'square', .12, 0, i * .06)); break;
      case 'bomb': this.noise(.95, 1, 3000); this.tone(140, 1.2, 'sawtooth', .35, .2); break;
      case 'die': this.noise(.9, .8, 1600); this.tone(420, .7, 'sawtooth', .3, .1); break;
      case 'start': [392, 523, 659, 784].forEach((f, i) => this.tone(f, .12, 'square', .12, 0, i * .09)); break;
      case 'warn': for (let i = 0; i < 4; i++) { this.tone(440, .25, 'square', .12, 0, i * .5); this.tone(330, .25, 'square', .12, 0, i * .5 + .25); } break;
      case 'clear': [523, 659, 784, 1047, 784, 1047].forEach((f, i) => this.tone(f, .14, 'triangle', .2, 0, i * .12)); break;
    }
  }
};

// ================== 游戏状态 ==================
let state = 'title', paused = false, mode = 1;
let players = [], pb = [], eb = [], enemies = [], parts = [], scorch = [], items = [], texts = [], bombsFx = [], pending = [];
let frame = 0, stageT = 0, loop = 0, schedule = [], schedIdx = 0, bossWarn = 0, clearT = 0, shake = 0, flash = 0, goTimer = 0, bgY = 0, killCount = 0, veeCount = 0;
let banner = null;
// 难度：spawn=敌人数量倍率 bs=敌弹速度 fr=开火频率 cnt=每次弹幕子弹数 hp=敌人血量 ramp=每轮难度递增幅度
const DIFFS = [
  { name: '儿童', kid: true, col: '#ff9ee0', spawn: 0.125, bs: 0.35, fr: 0.2, cnt: 0.25, hp: 0.4, ramp: 0.3, desc: '适合5岁小朋友，敌人很少，子弹很慢' },
  { name: '新手', col: '#7dffb0', spawn: 0.25, bs: 0.7,  fr: 0.4,  cnt: 0.5,  hp: 0.5,  ramp: 0.4, desc: '敌人约1/4，子弹少且慢，适合入门' },
  { name: '简单', col: '#a8e8ff', spawn: 0.6,  bs: 0.85, fr: 0.75, cnt: 0.75, hp: 0.75, ramp: 0.7, desc: '敌人和子弹较少，轻松爽快' },
  { name: '普通', col: '#ffe060', spawn: 1,    bs: 1,    fr: 1,    cnt: 1,    hp: 1,    ramp: 1,   desc: '标准难度' },
  { name: '困难', col: '#ff9a50', spawn: 1.4,  bs: 1.15, fr: 1.1,  cnt: 1.1,  hp: 1.25, ramp: 1.2, desc: '敌人更多，弹幕更快更密' },
  { name: '地狱', col: '#ff4040', spawn: 2,    bs: 1.3,  fr: 1.15, cnt: 1.15,  hp: 1.6,  ramp: 1.5, desc: '敌人翻倍，满屏弹幕，慎入！' }
];
// 难度按名称保存；兼容旧版按序号保存的设置和最高分
const OLD_DIFF_NAMES = ['新手', '简单', '普通', '困难', '地狱'];
const diffByName = n => DIFFS.findIndex(d => d.name === n);
let diffIdx = diffByName('普通');
try {
  const n = localStorage.getItem('leidian2p_diffname');
  if (n !== null && diffByName(n) >= 0) diffIdx = diffByName(n);
  else { const v = localStorage.getItem('leidian2p_diff'); if (v !== null && OLD_DIFF_NAMES[+v]) diffIdx = diffByName(OLD_DIFF_NAMES[+v]); }
  OLD_DIFF_NAMES.forEach((n, i) => { if (n === '普通') return; const old = localStorage.getItem('leidian2p_hi_' + i), k = 'leidian2p_hi_' + n;
    if (old !== null && localStorage.getItem(k) === null) localStorage.setItem(k, old); localStorage.removeItem('leidian2p_hi_' + i); });
} catch (e) {}
let DF = DIFFS[diffIdx];
const hiKey = () => DF.name === '普通' ? 'leidian2p_hi' : 'leidian2p_hi_' + DF.name;
let hiScore = 0;
function loadHi() { hiScore = 0; try { hiScore = +localStorage.getItem(hiKey()) || 0; } catch (e) {} }
function setDiff(i) { diffIdx = (i + DIFFS.length) % DIFFS.length; DF = DIFFS[diffIdx]; loadHi(); try { localStorage.setItem('leidian2p_diffname', DF.name); localStorage.removeItem('leidian2p_diff'); } catch (e) {} }
loadHi();
const D = { get bs() { return DF.bs * (1 + 0.15 * RL() * DF.ramp); }, get fr() { return DF.fr * (1 + 0.3 * RL() * DF.ramp); }, get hp() { return DF.hp * (1 + 0.45 * RL() * DF.ramp); } };
let spawnAcc = 0;
const clouds = []; for (let i = 0; i < 7; i++) clouds.push({ x: rand(0, W), y: rand(-200, H), w: rand(60, 140), s: rand(2.2, 3.4), seed: Math.random() * 100 });

function makePlayer(id, n) {
  return { id, x: n === 1 ? W / 2 : (id === 0 ? W * 0.33 : W * 0.67), y: H - 90, alive: true, lives: 3, hp: MAXHP, hurtT: 0, bombs: 3, score: 0,
    wtype: id === 0 ? 'red' : 'blue', wlv: 1, sub: null, slv: 1, subCd: 30, subSide: 1, fireCd: 0, bombCd: 0, inv: 120, respawnT: 0, bank: 0,
    color: id === 0 ? '#ff5a4a' : '#4fb8ff', color2: id === 0 ? '#b8281e' : '#1f6fb8' };
}
function startGame(n) {
  mode = n; players = []; for (let i = 0; i < n; i++) players.push(makePlayer(i, n));
  pb = []; eb = []; beams = []; enemies = []; parts = []; scorch = []; items = []; texts = []; bombsFx = []; pending = [];
  loop = 0; killCount = 0; spawnAcc = 0; goTimer = 0; paused = false; state = 'play'; startStage(); Snd.play('start');
}
function startStage() {
  stageT = 0; beams = []; schedule = buildStage(); schedIdx = 0; bossWarn = 0; clearT = 0; pending = [];
  banner = null; openEnQuiz();
}
function beginStage() {
  banner = { text: `第 ${loop + 1} 关 · ${STAGES[stageNo()].name}`, sub: loop >= STAGE_COUNT ? `第 ${Math.floor(loop / STAGE_COUNT) + 1} 轮 · 难度提升！` : '出击！', t: 160 };
  clearKeys();
}
const MAXHP = 3;
const later = (d, f) => pending.push({ t: stageT + d, f });

// ================== 关卡编排 ==================
function buildStage() { return stageScript(STAGES[stageNo()].script); }

// ================== 敌人生成 ==================
function mkE(o) {
  // 按难度调整敌人数量（Boss 和携带火力/炸弹道具的敌人总会出现）
  if (DF.kid && (o.type === 'kami' || o.type === 'sniper')) return null; // 儿童难度没有自爆机和狙击机
  if (DF.spawn !== 1 && o.type !== 'boss' && !o.dup && !o.child && !(o.nodup && DF.spawn > 1)) {
    const must = o.drop === 'W' || o.drop === 'BOMB' || o.drop === 'S';
    spawnAcc += DF.spawn;
    if (DF.spawn < 1) { if (spawnAcc < 1) { if (must) spawnItem(o.drop, o.x, 30); return null; } spawnAcc -= 1; }
    else {
      spawnAcc -= 1; let k = 0;
      while (spawnAcc >= 1) {
        spawnAcc -= 1; k++;
        const c = Object.assign({}, o, { dup: true, drop: null, drop2: null, drop3: null, x: W - o.x });
        if (c.bx !== undefined) c.bx = W - c.bx;
        if (c.amp) c.amp = -c.amp; if (c.side) c.side = -c.side; if (c.vx) c.vx = -c.vx;
        later(40 * k, () => mkE(c));
      }
    }
  }
  const e = Object.assign({ t: 0, flash: 0, ground: false, hw: 12, hh: 12, fireT: rand(40, 100), score: 100, drop: null, dead: false, vx: 0, vy: 0, dir: PI / 2, st: 0, t2: 0 }, o);
  e.maxhp = e.hp; enemies.push(e); return e;
}
function fighter(o) { return mkE(Object.assign({ type: 'fighter', hp: 2 * D.hp, hw: 13, hh: 12, score: 150 }, o)); }
function waveVee(cx) {
  veeCount++;
  [0, -1, 1, -2, 2].forEach((o, i) => fighter({ x: cx + o * 34, y: -20 - Math.abs(o) * 30, vy: 2.6, pat: 'straight', drop: i === 0 ? (veeCount % 2 ? 'W' : 'S') : null }));
}
function waveSine(side) {
  for (let i = 0; i < 6; i++) later(i * 14, () => fighter({ x: side < 0 ? W * 0.3 : W * 0.7, bx: side < 0 ? W * 0.3 : W * 0.7, y: -20, vy: 2.3, pat: 'sine', amp: 100 * side, drop: i === 5 ? 'MEDAL' : null }));
}
function waveSwoop(side) {
  for (let i = 0; i < 6; i++) later(i * 12, () => fighter({ x: side < 0 ? 50 : W - 50, y: -20, pat: 'swoop', side, ang: PI / 2, sp: 3.8 }));
}
function waveCross() {
  for (let i = 0; i < 5; i++) {
    later(i * 16, () => fighter({ x: -20, y: 110 + i * 18, vx: 3, vy: 0.6, pat: 'straight' }));
    later(i * 16 + 8, () => fighter({ x: W + 20, y: 200 + i * 18, vx: -3, vy: 0.6, pat: 'straight' }));
  }
}
function spawnTank(x) { mkE({ type: 'tank', ground: true, x, y: -30, vy: SCROLL + 0.5, vx: rand(-0.4, 0.4), hp: 6 * D.hp, hw: 15, hh: 17, score: 300, ta: PI / 2, medal: 0.3 }); }
function spawnTurret(x) { mkE({ type: 'turret', ground: true, x, y: -30, vy: SCROLL, hp: 10 * D.hp, hw: 16, hh: 16, score: 500, ta: PI / 2, medal: 0.5 }); }
function spawnGunship(x, drop) { mkE({ type: 'gunship', x, y: -40, hp: 18 * D.hp, hw: 28, hh: 20, score: 1000, drop, stopY: rand(130, 190) }); }
function spawnBomber(x) { mkE({ type: 'bomber', x, y: -60, hp: 60 * D.hp, hw: 52, hh: 30, score: 3000, drop: 'W', drop2: 'BOMB', drop3: 'S', fireB: 60 }); }

// ================== 8 个关卡：主题 / 敌人编排 / Boss ==================
// 难度递增：每打完一轮 8 关，难度明显提升；同一轮里每关略微提升
const RL = () => Math.floor(loop / 8) + (loop % 8) * 0.06;
const STAGE_COUNT = 8;
const stageNo = () => loop % STAGE_COUNT;
const PALS = {
  grass:   { g1: '#2f5d2b', g2: '#386c32', g3: '#284f25', sand: '#b8a46c', water: '#1d5687', water2: '#3a82b8', road: '#5d5b52', tree: '#1c4020', tree2: '#2c5a2a', bld: '#8c8a80', roof: '#a0463a', bldP: 0.975, treeP: 0.8, roadN: 160 },
  desert:  { g1: '#c4a160', g2: '#ba9655', g3: '#cfae70', sand: '#e3cc92', water: '#2f7598', water2: '#59a3c4', road: '#7a6648', tree: '#5d6a2e', tree2: '#7a8a3c', bld: '#b49a70', roof: '#8a5a3a', bldP: 0.975, treeP: 0.92, roadN: 160 },
  snow:    { g1: '#d9e3ec', g2: '#cad7e2', g3: '#e6edf3', sand: '#a8b6c2', water: '#37628c', water2: '#6f9cc4', road: '#7c8188', tree: '#2c4838', tree2: '#3e6050', bld: '#9aa0a8', roof: '#6a4a5a', bldP: 0.975, treeP: 0.8, roadN: 160 },
  city:    { g1: '#55585e', g2: '#61646b', g3: '#4a4d52', sand: '#8a8a86', water: '#2b4f6e', water2: '#46739a', road: '#3c3d40', tree: '#2f5a34', tree2: '#3f7244', bld: '#9aa3ae', roof: '#4c6a8a', bldP: 0.68, treeP: 0.6, roadN: 40 },
  volcano: { g1: '#3a2c28', g2: '#46332c', g3: '#2c2220', sand: '#1c1412', water: '#d8461a', water2: '#ffb030', road: '#2a2422', tree: '#5a4a44', tree2: '#6e5c54', bld: '#55463f', roof: '#8a2a1a', bldP: 2, treeP: 0.86, roadN: 0 },
  jungle:  { g1: '#1f4a22', g2: '#24562a', g3: '#183c1b', sand: '#4a5a2a', water: '#3a5a3a', water2: '#5a7a4a', road: '#5a4a30', tree: '#0f3312', tree2: '#2a6a26', bld: '#6a5a3a', roof: '#8a6a2a', bldP: 0.995, treeP: 0.42, roadN: 0 },
};
const BOSS_DEF = {
  fortress: { name: '钢铁要塞', hp: 900, hw: 92, hh: 48 },
  sea:      { name: '巨舰「海神号」', hp: 1000, hw: 100, hh: 70, ground: true, ty: 170 },
  scorpion: { name: '沙漠巨蝎', hp: 950, hw: 78, hh: 58, ground: true, ty: 170 },
  wing:     { name: '冰霜飞翼', hp: 900, hw: 118, hh: 34, ty: 130 },
  twinheli: { name: '雷霆双旋翼', hp: 900, hw: 70, hh: 56, ty: 150 },
  cannon:   { name: '熔岩巨炮', hp: 1000, hw: 100, hh: 56, ground: true, ty: 160 },
  carrier:  { name: '空中航母', hp: 1000, hw: 110, hh: 56, ty: 140 },
  core:     { name: '核心母舰', hp: 950, hw: 66, hh: 66, ty: 200 },
};
function stageScript(fn) {
  const s = []; let t = 100;

  fn(at);
  at(200, () => { bossWarn = 200; Snd.play('warn'); });

}
const STAGES = [
  { name: '草原', bg: 'land', pal: 'grass', boss: 'fortress', script: at => {

    at(120, () => waveCross());
    at(100, () => { spawnTurret(80); spawnTurret(240); spawnTurret(400); });
    at(90, () => spawnGunship(W * 0.25, 'W')); at(20, () => spawnGunship(W * 0.75, 'MEDAL'));
    at(140, () => waveVee(W / 2));
    at(90, () => spawnHeli(W * 0.25)); at(40, () => spawnHeli(W * 0.75));
    at(200, () => waveSine(-1)); at(30, () => waveSine(1));
    at(120, () => { spawnTank(150); spawnTank(330); }); at(60, () => waveSwoop(1));
    at(100, () => waveCross());

  { name: '海洋', bg: 'sea', boss: 'sea', script: at => {
    at(0, () => waveVee(W / 2));
    at(100, () => { spawnBoat(100, 0.3); spawnBoat(380, -0.3); });
    at(90, () => waveSine(-1));
    at(100, () => spawnHeli(W * 0.3)); at(40, () => spawnHeli(W * 0.7));
    at(120, () => spawnShip(W * 0.28, 'W'));
    at(150, () => { for (let i = 0; i < 5; i++) later(i * 20, () => spawnMine(60 + i * 90)); });
    at(120, () => { spawnBoat(60, 0.6); spawnBoat(240); spawnBoat(420, -0.6); });
    at(90, () => waveSwoop(1));
    at(80, () => spawnGunship(W * 0.5, 'S'));
    at(140, () => spawnShip(W * 0.72, 'BOMB'));
    at(160, () => waveVee(W * 0.3)); at(30, () => waveVee(W * 0.7));
    at(120, () => spawnBomber(W / 2));
    at(240, () => { spawnHeli(W * 0.2); spawnHeli(W * 0.8); });
    at(100, () => { for (let i = 0; i < 6; i++) later(i * 15, () => spawnMine(rand(40, W - 40))); });
    at(120, () => { spawnBoat(150, 0.2); spawnBoat(330, -0.2); });
    at(100, () => waveCross());
    at(120, () => spawnShip(W / 2, 'MEDAL'));
    at(200, () => waveSine(1)); at(40, () => waveSine(-1));
  } },
  { name: '沙漠', bg: 'land', pal: 'desert', boss: 'scorpion', script: at => {
    at(0, () => { spawnTank(100); spawnTank(240); spawnTank(380); });
    at(100, () => waveVee(W / 2));
    at(100, () => { spawnKami(W * 0.25); later(30, () => spawnKami(W * 0.75)); });
    at(110, () => spawnSniper(W * 0.5));
    at(100, () => { spawnTurret(90); spawnTurret(390); });
    at(90, () => waveSwoop(-1));

// ---------- 新敌人行为 ----------
function updEnemyX(e) {
  const fr = D.fr;
  switch (e.type) {
    case 'heli': { // 飞入 → 停住连射三轮 → 侧向离开
      e.rot += 0.5;
      if (e.st === 0) { e.y += 2.4; if (e.y >= e.stopY) { e.st = 1; e.t2 = 0; } }
      else if (e.st === 1) {
        e.t2++; e.x += Math.sin(e.t2 * 0.05) * 0.4;
        if (e.t2 % Math.max(1, Math.round(45 / fr)) === 25 % Math.max(1, Math.round(45 / fr)) && onScreen(e)) fan(e.x, e.y + 12, aimAng(e.x, e.y), 3, 0.35, 2.8, 4, '#ffd040');
        if (e.t2 > 150) { e.st = 2; e.vx = e.x < W / 2 ? -2.6 : 2.6; }
      } else { e.x += e.vx; e.y -= 0.3; }
      break;
    }
    case 'kami': { // 自爆机：停顿闪烁（预警）→ 朝玩家当时的位置俯冲
      if (e.st === 0) { e.y += 2.5; if (e.y >= (e.stopY || (e.stopY = rand(60, 110)))) { e.st = 1; e.t2 = 0; } }
      else if (e.st === 1) {
        e.t2++; e.x += Math.sin(e.t * 0.3) * 0.5;
        if (e.t2 >= 40 * teleK()) {
          e.st = 2; const a = aimAng(e.x, e.y), sp = 5.5 * Math.min(1.25, D.bs);
          e.vx = Math.cos(a) * sp; e.vy = Math.sin(a) * sp;
        }
      } else { e.x += e.vx; e.y += e.vy; }
      break;
    }
    case 'sniper': { // 狙击机：红色瞄准线预警 → 锁定闪烁 → 一发快速子弹
      if (e.st === 0) { e.y += 2; if (e.y >= e.stopY) { e.st = 1; e.t2 = 0; } }
      else if (e.st === 1) {
        e.t2++; e.T = 70 * teleK();
        if (e.t2 < e.T) e.aim = aimAng(e.x, e.y);
        else if (e.t2 >= e.T + 18) {
          shot(e.x + Math.cos(e.aim) * 14, e.y + Math.sin(e.aim) * 14, e.aim, 6, 5, '#ff3030'); Snd.play('laser');
          e.t2 = 0; if (++e.shots >= 2) e.st = 2;
        }
      } else e.y -= 1.5;
      break;
    }
    case 'mine': { // 浮游水雷：玩家靠近会闪红灯，然后炸开一圈慢子弹
      e.y += e.vy; e.x += e.vx; e.rot += 0.03;
      const p = nearestPlayer(e.x, e.y);
      if (!e.arm && p && onScreen(e) && Math.hypot(p.x - e.x, p.y - e.y) < 85) e.arm = Math.round(45 * teleK());
      if (e.arm && --e.arm <= 0) { e.dead = true; explode(e.x, e.y, 0.7); Snd.play('boom'); if (!DF.kid) ring(e.x, e.y, 8, 1.8, rand(0, TAU), 4, '#ff9040'); }
      break;
    }
    case 'layer': { // 布雷机：横穿屏幕，一路投下水雷
      e.x += e.vx; e.y += Math.sin(e.t * 0.03) * 0.3;
      if (onScreen(e) && e.t % Math.max(20, Math.round(55 / fr)) === 0) spawnMine(e.x, { y: e.y + 10, child: true, vy: SCROLL * 0.6, vx: 0 });
      break;
    }
    case 'heavy': { // 重装炮艇：很厚的装甲，停在上方交替齐射
      if (e.st === 0) { e.y += 1.2; if (e.y >= e.stopY) { e.st = 1; e.t2 = 0; } }
      else if (e.st === 1) { e.t2++; e.x += Math.sin(e.t2 * 0.02) * 0.8; if (e.t2 > 420) e.st = 2; }
      else e.y += 1.0;
      if (onScreen(e)) {
        if (--e.fireT <= 0) { e.fireT = 50 / fr; e.alt = !e.alt; const sx = e.x + (e.alt ? -26 : 26); fan(sx, e.y + 20, aimAng(sx, e.y), 3, 0.25, 3.2, 4, '#ff70d0'); }
        if (e.t % Math.max(1, Math.round(130 / fr)) === 0) ring(e.x, e.y, 12, 1.8, e.t * 0.1, 4, '#7dd0ff');
      }
      break;
    }
    case 'splitter': { // 分裂机：被打爆后分成 3 架小飞机
      e.y += e.vy; e.x = e.bx + Math.sin(e.t * 0.04) * e.amp;
      if (--e.fireT <= 0) { e.fireT = 120 / fr; if (onScreen(e) && e.y < H * 0.6) shot(e.x, e.y + 10, aimAng(e.x, e.y), 2.8, 4, '#ffb040'); }
      break;
    }
    case 'mini': {
      e.x += e.vx; e.y += e.vy; e.vx *= 0.97; e.vy = e.vy * 0.97 + 0.08;
      if (e.t === 35 && onScreen(e) && !DF.kid) shot(e.x, e.y, aimAng(e.x, e.y), 2.6, 3, '#ffb040');
      break;
    }
    case 'boat': {
      e.y += e.vy; e.x += e.vx; if (e.x < 20 || e.x > W - 20) e.vx *= -1;
      if (--e.fireT <= 0) { e.fireT = rand(100, 160) / fr; if (onScreen(e) && e.y < H - 160) shot(e.x, e.y, aimAng(e.x, e.y), 2.6, 4, '#ffa040'); }
      break;
    }
    case 'ship': e.y += e.vy; break; // 战舰船身（炮塔是单独的敌人）
    case 'sturret': {
      const pa = e.parent;
      if (!pa || pa.dead || pa.gone) { e.dead = true; if (pa && pa.dead) explode(e.x, e.y, 1, true); return; }
      e.x = pa.x + e.ox; e.y = pa.y + e.oy; e.ta = aimAng(e.x, e.y);
      if (--e.fireT <= 0) { e.fireT = 100 / fr; if (onScreen(e) && e.y < H - 120) fan(e.x, e.y, e.ta, 2, 0.2, 2.6, 4, '#ffa040'); }
      break;
    }
  }
}

// ---------- 激光（Boss 用，先出现虚线预警再发射）----------
let beams = [];
function addBeam(owner, ox, oy, ang, o = {}) {
  const k = DF.bs < 0.8 ? 1.6 : 1;
  beams.push({ owner, ox, oy, ang, x: owner.x + ox, y: owner.y + oy, warn: Math.round((o.warn || 70) * k), fire: o.fire || 50, w: (o.w || 16) * (DF.bs < 0.5 ? 0.6 : 1), rot: o.rot || 0, t: 0, col: o.col || '#ff5050' });
}
function updBeams() {
  for (const b of beams) {
    const ow = b.owner;
    if (!ow || ow.dead || ow.dying) { b.done = true; continue; }
    b.t++; b.x = ow.x + b.ox; b.y = ow.y + b.oy;
    if (b.t > b.warn) {
      b.ang += b.rot; if (b.t === b.warn + 1) Snd.play('laser');
      const c = Math.cos(b.ang), s = Math.sin(b.ang);
      for (const p of players) {
        if (!p.alive || p.entering > 0 || p.inv > 0) continue;
        const dx = p.x - b.x, dy = p.y - b.y;
        if (dx * c + dy * s > 0 && Math.abs(-dx * s + dy * c) < b.w / 2 + 3) hurtPlayer(p);
      }
    }
    if (b.t > b.warn + b.fire) b.done = true;
  }
  beams = beams.filter(b => !b.done);
}
function drawBeams() {
  ctx.save(); ctx.lineCap = 'round';
  for (const b of beams) {
    const ex = b.x + Math.cos(b.ang) * 1600, ey = b.y + Math.sin(b.ang) * 1600;
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(ex, ey);
    if (b.t <= b.warn) {
      ctx.globalAlpha = frame % 10 < 5 ? 0.75 : 0.35; ctx.strokeStyle = b.col; ctx.lineWidth = 2; ctx.setLineDash([12, 9]); ctx.stroke(); ctx.setLineDash([]);
      ctx.globalAlpha = 0.8; circ(b.x, b.y, 4 + 10 * b.t / b.warn, b.col);
    } else {
      const k = clamp((b.warn + b.fire - b.t) / 10, 0, 1);
      ctx.globalAlpha = 0.45 * k; ctx.strokeStyle = b.col; ctx.lineWidth = b.w * 1.9; ctx.stroke();
      ctx.globalAlpha = k; ctx.lineWidth = b.w; ctx.stroke();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = b.w * 0.4; ctx.stroke();
    }
  }
  ctx.restore(); ctx.globalAlpha = 1;
}
function wall(y, sp, col) { // 一排子弹墙，留一个缺口
  const n = 12, gw = DF.cnt < 0.6 ? 4 : 2, g = ri(1, n - gw - 1);
  for (let i = 0; i < n; i++) if (i < g || i >= g + gw) eb.push({ x: 20 + i * (W - 40) / (n - 1), y, vx: 0, vy: sp * D.bs, r: 5, col });
}

function homingShot(x, y, vx, vy, col, home = 50, sp = 2.8) { eb.push({ x, y, vx: vx * D.bs, vy: vy * D.bs, r: 5, col, home, sp: sp * D.bs }); }

function updBoss(e) {
  if (e.kind === 'fortress' || !BOSS_AI[e.kind]) return bossFortress(e);
  const d = BOSS_DEF[e.kind];
  if (e.st === 0) { e.y += 1; if (e.y >= d.ty) { e.st = 1; e.t2 = 0; } return; }
  e.t2++;
  const fr = D.fr, r = e.hp / e.maxhp, ph = r > 0.66 ? 1 : r > 0.33 ? 2 : 3, every = n => e.t2 % Math.max(1, Math.round(n / fr)) === 0;
  if (ph !== e.ph) { if (e.ph) { beams = beams.filter(b => b.owner !== e); flash = 0.3; } e.ph = ph; e.pt = 0; }
  e.pt++;
  BOSS_AI[e.kind](e, ph, every);
}

      if (every(150)) ring(e.x, e.y, 16, 2, e.t2 * 0.05, 5, '#7dd0ff');
    } else if (ph === 2) {

      if (every(28)) { const i = Math.floor(e.t2 / 28) % 4; fan(e.x + T[i][0], e.y + T[i][1], e.ta[i], 3, 0.25, 3.6, 4, '#ffa040'); }

    rect(-2.5, -7, 5, 14, nuke ? '#f0f0e0' : '#e8d8ff'); poly([-2.5, -7, 2.5, -7, 0, -12], nuke ? '#ff7020' : '#a040ff');
    rect(-4.5, 4, 2, 4, '#888'); rect(2.5, 4, 2, 4, '#888');
    circ(0, 9 + Math.random() * 2, 2.5, nuke ? '#ffb040' : '#d080ff');
    ctx.restore(); return;
  }
  if (b.kind === 'red') {
    ctx.fillStyle = 'rgba(255,90,40,0.55)'; ctx.beginPath(); ctx.ellipse(b.x, b.y, 4, 9, Math.atan2(b.vx, -b.vy), 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff2c0'; ctx.beginPath(); ctx.ellipse(b.x, b.y, 2, 5.5, Math.atan2(b.vx, -b.vy), 0, TAU); ctx.fill();
  } else {
    ctx.fillStyle = 'rgba(60,170,255,0.45)'; ctx.fillRect(b.x - b.w / 2 - 2, b.y - b.h / 2, b.w + 4, b.h);
    ctx.fillStyle = '#7fd8ff'; ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);

}
function drawEB(b) {
  if (b.fuse) { ctx.globalAlpha = b.fuse % 10 < 5 ? 0.9 : 0.4; ctx.strokeStyle = b.col; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 5, 0, TAU); ctx.stroke(); ctx.globalAlpha = 1; }
  ctx.globalAlpha = 0.45; circ(b.x, b.y, b.r + 2.5, b.col); ctx.globalAlpha = 1;
  circ(b.x, b.y, b.r, b.col); circ(b.x, b.y, b.r * 0.5, '#fff');
}
function drawParts() {
  ctx.save();
  for (const p of parts) {
    const k = p.life / p.max;
    if (p.type === 'smoke') { ctx.globalAlpha = k * 0.35; circ(p.x, p.y, p.size, '#3a3a3a'); }
    else if (p.type === 'debris') { ctx.globalAlpha = k; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); rect(-p.size / 2, -p.size / 2, p.size, p.size, '#2a2a2a'); ctx.restore(); }
  }
  ctx.globalCompositeOperation = 'lighter';
  for (const p of parts) {
    const k = p.life / p.max;
    if (p.type === 'spark') { ctx.globalAlpha = k; circ(p.x, p.y, p.size, p.col); }
    else if (p.type === 'flash') { ctx.globalAlpha = k * 0.8; circ(p.x, p.y, p.size * (1.2 - k * 0.6), '#ffcf60'); ctx.globalAlpha = k; circ(p.x, p.y, p.size * 0.5 * (1.2 - k * 0.6), '#ffffe0'); }

function drawBombs() {
  for (const b of bombsFx) {
    const k = b.t / 70;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = `rgba(255,${160 - k * 100 | 0},60,${1 - k})`; ctx.lineWidth = 26 * (1 - k) + 2;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.t * 13, 0, TAU); ctx.stroke();
    ctx.strokeStyle = `rgba(255,255,200,${(1 - k) * 0.8})`; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.t * 9, 0, TAU); ctx.stroke();

// ================== HUD ==================
function miniJet(x, y, col) { ctx.save(); ctx.translate(x, y); ctx.scale(0.42, 0.42); drawJet(0, 0, col, '#333', 0); ctx.restore(); }
function drawHUD() {
  const grd = ctx.createLinearGradient(0, 0, 0, 48); grd.addColorStop(0, 'rgba(0,0,0,0.6)'); grd.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grd; ctx.fillRect(0, 0, W, 48);
  for (const p of players) {
    const left = p.id === 0, x = left ? 10 : W - 10, al = left ? 'left' : 'right';
    text(`${p.id + 1}P`, x, 12, 14, p.color, al);
    text(String(p.score).padStart(8, '0'), x + (left ? 28 : -28), 12, 15, '#fff', al);
    // 底部状态
    const by = H - 16;
    if (p.lives <= 0 && !p.alive) { text('已阵亡', x, by, 14, '#999', al); continue; }
    { const bw = 110, bx0 = left ? x : x - bw, k = p.alive ? p.hp / MAXHP : 0;
      text(`血量 ${p.alive ? p.hp : 0}/${MAXHP}`, x, by - 58, 12, '#e8f0e8', al);
      rect(bx0, by - 49, bw, 8, 'rgba(0,0,0,0.6)');
      rect(bx0 + 1, by - 48, (bw - 2) * k, 6, k > 0.5 ? '#50e070' : k > 0.25 ? '#ffd040' : '#ff4040'); }
    for (let i = 0; i < p.lives; i++) miniJet(left ? x + 8 + i * 16 : x - 8 - i * 16, by - 22, p.color);
    let bx = left ? x + 4 : x - 4;
    for (let i = 0; i < p.bombs; i++) { const cx = left ? bx + i * 15 + 4 : bx - i * 15 - 4; circ(cx, by, 6, '#2b9a4a'); text('B', cx, by + 1, 9, '#fff', 'center', true, false); }
    text(`${MAIN_W[p.wtype].name} Lv${p.wlv}`, x, 30, 12, MAIN_W[p.wtype].col, al);
    if (p.sub) text(`+${SUB_W[p.sub].name} Lv${p.slv}`, x, 45, 11, SUB_W[p.sub].col, al);
  }
  text(`总分 ${totalScore()}`, W / 2, 12, 15, '#ffe060');
  text(`最高 ${Math.max(hiScore, totalScore())} · 第${loop + 1}关 · `, W / 2 - 14, 31, 11, '#cfd8e0');
  text(DF.name, W / 2 + ctx.measureText(`最高 ${Math.max(hiScore, totalScore())} · 第${loop + 1}关 · `).width / 2 - 14, 31, 11, DF.col, 'left');
  const remain = PLAY_LIMIT - playFrames;
  text(`剩余时间 ${fmtTime(remain)}`, W / 2, 47, 11, remain < 3600 ? '#ff6060' : remain < 7200 ? '#ffb040' : '#9fd8a8');
  const boss = enemies.find(e => e.type === 'boss' && !e.dead);
  if (boss && boss.st > 0 && !boss.dying) {
    rect(60, 60, W - 120, 7, 'rgba(0,0,0,0.6)');
    rect(61, 61, (W - 122) * clamp(boss.hp / boss.maxhp, 0, 1), 5, '#ff4040');
    text('BOSS', 56, 64, 10, '#ff8080', 'right');
    text(BOSS_DEF[boss.kind] ? BOSS_DEF[boss.kind].name : '', W / 2, 76, 11, '#ffb0b0');
  }
}
function drawOverlay() {
  if (bossWarn > 0 && Math.floor(bossWarn / 15) % 2) {
    ctx.fillStyle = 'rgba(255,0,0,0.12)'; ctx.fillRect(0, 0, W, H);
    rect(0, H / 2 - 40, W, 80, 'rgba(0,0,0,0.5)');
    text('警告！强敌接近', W / 2, H / 2 - 10, 32, '#ff4040');

  }
  if (banner) {

    if (banner.sub) text(banner.sub, W / 2, H * 0.38 + 44, 18, '#fff');

  for (const t of texts) { ctx.globalAlpha = Math.min(1, t.t / 20); text(t.s, t.x, t.y, t.big ? 26 : 13, t.col); }
  ctx.globalAlpha = 1;
  if (goTimer > 0 && state === 'play') text('全员阵亡…', W / 2, H / 2, 28, '#ff6060');
  if (paused) {
    rect(0, 0, W, H, 'rgba(0,0,0,0.55)');
    text('暂 停', W / 2, H / 2 - 20, 40, '#fff');
    text('按 P 继续', W / 2, H / 2 + 26, 18, '#ccc');

}
function drawTitle() {
  rect(0, 0, W, H, 'rgba(0,8,20,0.55)');
  const g = ctx.createLinearGradient(0, 90, 0, 170); g.addColorStop(0, '#fff6a0'); g.addColorStop(0.5, '#ff9a30'); g.addColorStop(1, '#ff3a20');

  ctx.lineWidth = 10; ctx.strokeStyle = '#401008'; ctx.strokeText('雷电', W / 2, 130);
  ctx.fillStyle = g; ctx.fillText('雷电', W / 2, 130);

  drawJet(W / 2 - 50, 254 + Math.sin(frame * 0.05) * 6, '#ff5a4a', '#b8281e', Math.sin(frame * 0.03) * 0.5);

    ['移动：W A S D　　炸弹：K', '#fff', 13],
    ['2P 蓝机', '#6fc6ff', 15],
    ['移动：方向键　　炸弹：小键盘2 或 .', '#fff', 13],
    ['飞机全自动射击，无需按键　　P：暂停', '#cfe', 13],

  text('难度', 58, 580, 15, '#cfd8e0');

    text(d.name, x, 581, sel ? 16 : 13, sel ? d.col : '#778', 'center', sel, sel);

  if (Math.floor(frame / 30) % 2 === 0) text('按 1 单人游戏　　按 2 双人游戏', W / 2, 652, 21, '#ffe060');

}
function drawGameOver() {
  rect(0, 0, W, H, 'rgba(0,0,0,0.6)');
  text('游戏结束', W / 2, 220, 48, '#ff5050');
  players.forEach((p, i) => text(`${p.id + 1}P 得分：${p.score}`, W / 2, 300 + i * 34, 20, p.color));
  text(`总分：${totalScore()}`, W / 2, 300 + players.length * 34 + 16, 24, '#ffe060');
  text(`难度：${DF.name}　最高分：${hiScore}　到达第 ${loop + 1} 关`, W / 2, 300 + players.length * 34 + 56, 15, '#ccc');
  if (Math.floor(frame / 30) % 2 === 0) text('按 R 重新开始', W / 2, 520, 22, '#fff');
  text('按 Enter 返回标题', W / 2, 558, 16, '#aaa');
}

// ================== 渲染 ==================
function render() {
  ctx.setTransform(SC, 0, 0, SC, 0, 0);
  ctx.save();
  if (shake > 0) ctx.translate(rand(-shake, shake) * 0.5, rand(-shake, shake) * 0.5);
  drawBG();
  for (const s of scorch) { ctx.fillStyle = `rgba(20,15,10,${Math.min(0.5, s.life / 400)})`; ctx.beginPath(); ctx.ellipse(s.x, s.y, s.r, s.r * 0.8, 0, 0, TAU); ctx.fill(); }
  if (state !== 'title') {
    for (const e of enemies) if (e.ground && !e.parent) drawEnemy(e);
    for (const e of enemies) if (e.ground && e.parent) drawEnemy(e);
    items.forEach(drawItem);
  }
  drawClouds();
  if (state !== 'title') {
    for (const e of enemies) if (!e.ground) drawEnemy(e);
    pb.forEach(drawPB);
    players.forEach(drawPlayer);
    drawParts();
    drawBombs();
    drawBeams();
    eb.forEach(drawEB);
  } else drawParts();
  ctx.restore();
  if (flash > 0) { ctx.fillStyle = `rgba(255,250,230,${flash * 0.6})`; ctx.fillRect(0, 0, W, H); }
  if (state === 'title') drawTitle();
  else {
    drawHUD(); drawOverlay();
    if (state === 'gameover') drawGameOver();
    if (quiz && state === 'play') drawQuiz();
  }
  if (locked) drawLock();
}

// ================== 主循环 (固定60帧逻辑) ==================
let last = performance.now(), acc = 0;
const STEP = 1000 / 60;
function tick(now) {
  acc += Math.min(100, now - last); last = now;
  let n = 0;
  while (acc >= STEP && n < 5) { update(); pressed = {}; acc -= STEP; n++; }
  render();
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
// 调试/测试钩子
window.__game = { setLoop(n) { loop = n; quiz = null; startStage(); quiz = null; beginStage(); }, get loop() { return loop; }, STAGES, BOSS_DEF, spawnBoss, get beams() { return beams; }, skipQuiz() { if (quiz && quiz.kind === "en") { quiz = null; beginStage(); } else quiz = null; }, get pb() { return pb; }, activeUnits, WORDS, get quiz() { return quiz; }, get locked() { return locked; }, get playFrames() { return playFrames; }, set playFrames(v) { playFrames = v; }, PLAY_LIMIT, spawnItem, get items() { return items; }, startGame, setDiff, get eb() { return eb; }, get diff() { return DF.name; }, get state() { return state; }, get players() { return players; }, get enemies() { return enemies; }, setT(t) { stageT = t; }, update };
