<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>雷电·手机版</title>
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="雷电">
<meta name="theme-color" content="#05070c">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#05070c;overflow:hidden;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{position:fixed;left:0;top:0;right:0;bottom:0}
#wrap{position:absolute;left:0;top:0;right:0;bottom:0;box-sizing:border-box;display:flex;align-items:center;justify-content:center;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
canvas{display:block;background:#000;touch-action:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
'use strict';
// ================== 基础设置 ==================
const W = 480, SCROLL = 1.2;
let H = 860; // 逻辑高度随手机屏幕比例变化（860~1100），宽度固定480
const cv = document.getElementById('c'), wrap = document.getElementById('wrap');
let ctx = cv.getContext('2d');
let SC = 1;
function resize() {
  const cs = getComputedStyle(wrap), r = wrap.getBoundingClientRect();
  const aw = Math.max(1, r.width - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight));
  const ah = Math.max(1, r.height - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom));
  if (state !== 'play') H = Math.round(clamp(W * ah / aw, 860, 1100));
  const s = Math.min(aw / W, ah / H) || 1;
  const d = window.devicePixelRatio || 1;
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
  cv.width = Math.max(1, Math.round(W * s * d));
  cv.height = Math.max(1, Math.round(H * s * d));
  SC = cv.width / W;
}
const FONT = '"Microsoft YaHei","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Noto Serif CJK SC","WenQuanYi Micro Hei",sans-serif';
const PI = Math.PI, TAU = PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function hash(a, b) { let h = (a * 374761393 + b * 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }

// ================== 输入 ==================
const keys = {}; let pressed = {};
const PREVENT = new Set(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','KeyP','Quote']);
addEventListener('keydown', e => {
  Snd.init();
  if (locked) { e.preventDefault(); lockKey(e); return; }
  if (quiz && state === 'play') { e.preventDefault(); quizKey(e); return; }
  if (PREVENT.has(e.code)) e.preventDefault();
  if (!keys[e.code]) pressed[e.code] = true;
  keys[e.code] = true; Snd.init();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; drag.id = null; if (state === 'play' && !quiz && !locked) paused = true; });
const CTRL = [
  { up:['KeyW','ArrowUp'], down:['KeyS','ArrowDown'], left:['KeyA','ArrowLeft'], right:['KeyD','ArrowRight'], bomb:['KeyK','Space'] }
];
// ---------- 触屏 ----------
// 相对拖动：手指在屏幕任意位置按下后移动，飞机按同样的位移移动（飞机不会跳到手指下面，手指不挡飞机）
const TOUCH_SENS = 1.25;
const drag = { id: null, lx: 0, ly: 0, dx: 0, dy: 0 };
let btns = [], UIY = 0, bombReq = false, lp = null, lockPad = false;
const btnFx = {};
function ptPos(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; }
function rrectPath(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function button(x, y, w, h, label, cb, o = {}) {
  const id = o.id || label + '@' + Math.round(x) + ',' + Math.round(y), hot = frame - (btnFx[id] || -99) < 8;
  rrectPath(x, y, w, h, o.r == null ? 12 : o.r);
  ctx.fillStyle = hot ? (o.hot || 'rgba(255,255,255,0.55)') : (o.bg || 'rgba(20,40,70,0.85)'); ctx.fill();
  ctx.lineWidth = o.lw || 2; ctx.strokeStyle = o.border || 'rgba(150,200,255,0.7)'; ctx.stroke();
  if (label) text(label, x + w / 2, y + h / 2 + 1, o.size || 22, o.col || '#fff', 'center', true, !!o.stroke);
  if (!o.disabled) btns.push({ x, y: y + UIY, w, h, cb, id });
}
function pressBtn(b) { btnFx[b.id] = frame; Snd.play('hit'); b.cb(); }
function canTouchPlay() { return state === 'play' && !quiz && !paused && !locked; }
addEventListener('pointerdown', e => {
  if (e.cancelable) e.preventDefault();
  Snd.init();
  const [x, y] = ptPos(e);
  for (let i = btns.length - 1; i >= 0; i--) { const b = btns[i]; if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { pressBtn(b); return; } }
  if (locked) { if (!lockPad && Math.abs(x - W / 2) < 150 && Math.abs(y - (310 + lockUIY())) < 40) lp = { id: e.pointerId, t: 0, x, y }; return; }
  if (canTouchPlay() && drag.id === null) { drag.id = e.pointerId; drag.lx = x; drag.ly = y; drag.dx = drag.dy = 0; }
}, { passive: false });
addEventListener('pointermove', e => {
  if (e.cancelable) e.preventDefault();
  const [x, y] = ptPos(e);
  if (e.pointerId === drag.id) { drag.dx += x - drag.lx; drag.dy += y - drag.ly; drag.lx = x; drag.ly = y; }
  if (lp && lp.id === e.pointerId && Math.hypot(x - lp.x, y - lp.y) > 30) lp = null;
}, { passive: false });
function ptEnd(e) { if (e.pointerId === drag.id) { drag.id = null; drag.dx = drag.dy = 0; } if (lp && lp.id === e.pointerId) lp = null; }
addEventListener('pointerup', ptEnd); addEventListener('pointercancel', ptEnd);
// 禁止页面滚动、回弹、双击/双指缩放、长按菜单
for (const ev of ['touchstart', 'touchmove']) document.addEventListener(ev, e => { if (e.cancelable) e.preventDefault(); }, { passive: false });
document.addEventListener('touchend', e => { Snd.init(); if (e.cancelable) e.preventDefault(); }, { passive: false });
for (const ev of ['gesturestart', 'gesturechange', 'dblclick', 'contextmenu', 'selectstart']) document.addEventListener(ev, e => e.preventDefault(), { passive: false });
document.addEventListener('visibilitychange', () => { if (document.hidden) { savePlay(); if (state === 'play' && !quiz && !locked) paused = true; drag.id = null; } });
const held = a => a.some(k => keys[k]);
const hit = a => a.some(k => pressed[k]);

// ================== 音效 (WebAudio) ==================
const Snd = {
  ac: null, master: null, last: {}, nb: null,
  init() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    try {
      this.ac = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ac.createGain(); this.master.gain.value = 0.22; this.master.connect(this.ac.destination);
    } catch (e) { this.ac = null; }
  },
  tone(f, dur, type = 'square', vol = .3, slide = 0, delay = 0) {
    const ac = this.ac; if (!ac) return;
    const t = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f * slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol = .5, freq = 800) {
    const ac = this.ac; if (!ac) return;
    if (!this.nb) { const len = ac.sampleRate; const b = ac.createBuffer(1, len, ac.sampleRate); const d = b.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1; this.nb = b; }
    const t = ac.currentTime, s = ac.createBufferSource(); s.buffer = this.nb;
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(freq, t); f.frequency.exponentialRampToValueAtTime(50, t + dur);
    const g = ac.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t); s.stop(t + Math.min(dur, 0.99));
  },
  play(n) {
    if (!this.ac) return;
    const now = performance.now(), gap = { shot: 75, laser: 75, hit: 45, boom: 40 }[n] || 0;
    if (gap && now - (this.last[n] || 0) < gap) return; this.last[n] = now;
    switch (n) {
      case 'shot': this.tone(900, .05, 'square', .04, .5); break;
      case 'laser': this.tone(1500, .06, 'sawtooth', .03, .6); break;
      case 'hit': this.tone(240, .03, 'square', .04); break;
      case 'ouch': this.tone(200, .12, 'sawtooth', .2, .5); break;
      case 'boom': this.noise(.35, .45, 1400); break;
      case 'big': this.noise(.95, .9, 2200); this.tone(90, .8, 'sawtooth', .3, .3); break;
      case 'item': this.tone(660, .08, 'triangle', .3); this.tone(990, .12, 'triangle', .3, 0, .07); break;
      case 'power': [523, 659, 784, 1047].forEach((f, i) => this.tone(f, .1, 'square', .12, 0, i * .06)); break;
      case 'bomb': this.noise(.95, 1, 3000); this.tone(140, 1.2, 'sawtooth', .35, .2); break;
      case 'die': this.noise(.9, .8, 1600); this.tone(420, .7, 'sawtooth', .3, .1); break;
      case 'start': [392, 523, 659, 784].forEach((f, i) => this.tone(f, .12, 'square', .12, 0, i * .09)); break;
      case 'warn': for (let i = 0; i < 4; i++) { this.tone(440, .25, 'square', .12, 0, i * .5); this.tone(330, .25, 'square', .12, 0, i * .5 + .25); } break;
      case 'clear': [523, 659, 784, 1047, 784, 1047].forEach((f, i) => this.tone(f, .14, 'triangle', .2, 0, i * .12)); break;
    }
  }
};

// ================== 游戏状态 ==================
let state = 'title', paused = false, mode = 1;
let players = [], pb = [], eb = [], enemies = [], parts = [], scorch = [], items = [], texts = [], bombsFx = [], pending = [];
let frame = 0, stageT = 0, loop = 0, schedule = [], schedIdx = 0, bossWarn = 0, clearT = 0, shake = 0, flash = 0, goTimer = 0, bgY = 0, killCount = 0, veeCount = 0;
let banner = null;
// 难度：spawn=敌人数量倍率 bs=敌弹速度 fr=开火频率 cnt=每次弹幕子弹数 hp=敌人血量 ramp=每轮难度递增幅度
const DIFFS = [
  { name: '儿童', col: '#ff9ee0', spawn: 0.125, bs: 0.35, fr: 0.2, cnt: 0.25, hp: 0.4, ramp: 0.3, desc: '适合5岁小朋友，敌人很少，子弹很慢' },
  { name: '新手', col: '#7dffb0', spawn: 0.25, bs: 0.7,  fr: 0.4,  cnt: 0.5,  hp: 0.5,  ramp: 0.4, desc: '敌人约1/4，子弹少且慢，适合入门' },
  { name: '简单', col: '#a8e8ff', spawn: 0.6,  bs: 0.85, fr: 0.75, cnt: 0.75, hp: 0.75, ramp: 0.7, desc: '敌人和子弹较少，轻松爽快' },
  { name: '普通', col: '#ffe060', spawn: 1,    bs: 1,    fr: 1,    cnt: 1,    hp: 1,    ramp: 1,   desc: '标准难度' },
  { name: '困难', col: '#ff9a50', spawn: 1.4,  bs: 1.15, fr: 1.1,  cnt: 1.1,  hp: 1.25, ramp: 1.2, desc: '敌人更多，弹幕更快更密' },
  { name: '地狱', col: '#ff4040', spawn: 2,    bs: 1.3,  fr: 1.15, cnt: 1.15,  hp: 1.6,  ramp: 1.5, desc: '敌人翻倍，满屏弹幕，慎入！' }
];
// 难度按名称保存；兼容旧版按序号保存的设置和最高分
const OLD_DIFF_NAMES = ['新手', '简单', '普通', '困难', '地狱'];
const diffByName = n => DIFFS.findIndex(d => d.name === n);
let diffIdx = diffByName('普通');
try {
  const n = localStorage.getItem('leidian2p_diffname');
  if (n !== null && diffByName(n) >= 0) diffIdx = diffByName(n);
  else { const v = localStorage.getItem('leidian2p_diff'); if (v !== null && OLD_DIFF_NAMES[+v]) diffIdx = diffByName(OLD_DIFF_NAMES[+v]); }
  OLD_DIFF_NAMES.forEach((n, i) => { if (n === '普通') return; const old = localStorage.getItem('leidian2p_hi_' + i), k = 'leidian2p_hi_' + n;
    if (old !== null && localStorage.getItem(k) === null) localStorage.setItem(k, old); localStorage.removeItem('leidian2p_hi_' + i); });
} catch (e) {}
let DF = DIFFS[diffIdx];
const hiKey = () => DF.name === '普通' ? 'leidian2p_hi' : 'leidian2p_hi_' + DF.name;
let hiScore = 0;
function loadHi() { hiScore = 0; try { hiScore = +localStorage.getItem(hiKey()) || 0; } catch (e) {} }
function setDiff(i) { diffIdx = (i + DIFFS.length) % DIFFS.length; DF = DIFFS[diffIdx]; loadHi(); try { localStorage.setItem('leidian2p_diffname', DF.name); localStorage.removeItem('leidian2p_diff'); } catch (e) {} }
loadHi();
const D = { get bs() { return DF.bs * (1 + 0.15 * loop * DF.ramp); }, get fr() { return DF.fr * (1 + 0.3 * loop * DF.ramp); }, get hp() { return DF.hp * (1 + 0.45 * loop * DF.ramp); } };
let spawnAcc = 0;
const clouds = []; for (let i = 0; i < 7; i++) clouds.push({ x: rand(0, W), y: rand(-200, H), w: rand(60, 140), s: rand(2.2, 3.4), seed: Math.random() * 100 });

function makePlayer(id, n) {
  return { id, x: n === 1 ? W / 2 : (id === 0 ? W * 0.33 : W * 0.67), y: H - 90, alive: true, lives: 3, hp: MAXHP, hurtT: 0, bombs: 3, score: 0,
    wtype: id === 0 ? 'red' : 'blue', wlv: 1, sub: null, slv: 1, subCd: 30, subSide: 1, fireCd: 0, bombCd: 0, inv: 120, respawnT: 0, bank: 0,
    color: id === 0 ? '#ff5a4a' : '#4fb8ff', color2: id === 0 ? '#b8281e' : '#1f6fb8' };
}
function startGame(n) {
  mode = n; players = []; for (let i = 0; i < n; i++) players.push(makePlayer(i, n));
  pb = []; eb = []; enemies = []; parts = []; scorch = []; items = []; texts = []; bombsFx = []; pending = [];
  loop = 0; killCount = 0; spawnAcc = 0; goTimer = 0; paused = false; state = 'play'; startStage(); Snd.play('start');
}
function startStage() {
  stageT = 0; schedule = buildStage(); schedIdx = 0; bossWarn = 0; clearT = 0; pending = [];
  banner = null; openEnQuiz();
}
function beginStage() {
  banner = { text: `第 ${loop + 1} 关`, sub: loop ? '难度提升！' : '出击！', t: 160 };
  clearKeys();
}
const MAXHP = 20;
const later = (d, f) => pending.push({ t: stageT + d, f });

// ================== 关卡编排 ==================
function buildStage() {
  const s = []; let t = 100;
  const at = (dt, f) => { t += dt; s.push([t, f]); };
  at(0, () => waveVee(W / 2));
  at(110, () => waveSine(-1));
  at(120, () => waveSine(1));
  at(110, () => { spawnTank(90); spawnTank(390); });
  at(90, () => waveSwoop(-1));
  at(70, () => spawnGunship(W * 0.3, 'W'));
  at(100, () => waveSwoop(1));
  at(80, () => { spawnTurret(110); spawnTurret(370); });
  at(120, () => waveVee(W * 0.3)); at(30, () => waveVee(W * 0.7));
  at(130, () => spawnBomber(W / 2));
  at(220, () => waveSine(1)); at(40, () => waveSine(-1));
  at(100, () => { spawnTank(60); spawnTank(240); spawnTank(420); });
  at(80, () => spawnGunship(W * 0.7, 'BOMB'));
  at(90, () => waveSwoop(-1)); at(50, () => waveSwoop(1));
  at(120, () => waveCross());
  at(100, () => { spawnTurret(80); spawnTurret(240); spawnTurret(400); });
  at(90, () => spawnGunship(W * 0.25, 'W')); at(20, () => spawnGunship(W * 0.75, 'MEDAL'));
  at(140, () => waveVee(W / 2));
  at(90, () => spawnBomber(W * 0.3)); at(80, () => spawnBomber(W * 0.7));
  at(260, () => waveSine(-1)); at(30, () => waveSine(1));
  at(120, () => { spawnTank(150); spawnTank(330); }); at(60, () => waveSwoop(1));
  at(100, () => waveCross());
  at(200, () => { bossWarn = 200; Snd.play('warn'); });
  at(200, () => spawnBoss());
  return s;
}

// ================== 敌人生成 ==================
function mkE(o) {
  // 按难度调整敌人数量（Boss 和携带火力/炸弹道具的敌人总会出现）
  if (DF.spawn !== 1 && o.type !== 'boss' && !o.dup) {
    const must = o.drop === 'W' || o.drop === 'BOMB' || o.drop === 'S';
    spawnAcc += DF.spawn;
    if (DF.spawn < 1) { if (spawnAcc < 1) { if (must) spawnItem(o.drop, o.x, 30); return null; } spawnAcc -= 1; }
    else {
      spawnAcc -= 1; let k = 0;
      while (spawnAcc >= 1) {
        spawnAcc -= 1; k++;
        const c = Object.assign({}, o, { dup: true, drop: null, drop2: null, drop3: null, x: W - o.x });
        if (c.bx !== undefined) c.bx = W - c.bx;
        if (c.amp) c.amp = -c.amp; if (c.side) c.side = -c.side; if (c.vx) c.vx = -c.vx;
        later(40 * k, () => mkE(c));
      }
    }
  }
  const e = Object.assign({ t: 0, flash: 0, ground: false, hw: 12, hh: 12, fireT: rand(40, 100), score: 100, drop: null, dead: false, vx: 0, vy: 0, dir: PI / 2, st: 0, t2: 0 }, o);
  e.maxhp = e.hp; enemies.push(e); return e;
}
function fighter(o) { return mkE(Object.assign({ type: 'fighter', hp: 2 * D.hp, hw: 13, hh: 12, score: 150 }, o)); }
function waveVee(cx) {
  veeCount++;
  [0, -1, 1, -2, 2].forEach((o, i) => fighter({ x: cx + o * 34, y: -20 - Math.abs(o) * 30, vy: 2.6, pat: 'straight', drop: i === 0 ? (veeCount % 2 ? 'W' : 'S') : null }));
}
function waveSine(side) {
  for (let i = 0; i < 6; i++) later(i * 14, () => fighter({ x: side < 0 ? W * 0.3 : W * 0.7, bx: side < 0 ? W * 0.3 : W * 0.7, y: -20, vy: 2.3, pat: 'sine', amp: 100 * side, drop: i === 5 ? 'MEDAL' : null }));
}
function waveSwoop(side) {
  for (let i = 0; i < 6; i++) later(i * 12, () => fighter({ x: side < 0 ? 50 : W - 50, y: -20, pat: 'swoop', side, ang: PI / 2, sp: 3.8 }));
}
function waveCross() {
  for (let i = 0; i < 5; i++) {
    later(i * 16, () => fighter({ x: -20, y: 110 + i * 18, vx: 3, vy: 0.6, pat: 'straight' }));
    later(i * 16 + 8, () => fighter({ x: W + 20, y: 200 + i * 18, vx: -3, vy: 0.6, pat: 'straight' }));
  }
}
function spawnTank(x) { mkE({ type: 'tank', ground: true, x, y: -30, vy: SCROLL + 0.5, vx: rand(-0.4, 0.4), hp: 6 * D.hp, hw: 15, hh: 17, score: 300, ta: PI / 2, medal: 0.3 }); }
function spawnTurret(x) { mkE({ type: 'turret', ground: true, x, y: -30, vy: SCROLL, hp: 10 * D.hp, hw: 16, hh: 16, score: 500, ta: PI / 2, medal: 0.5 }); }
function spawnGunship(x, drop) { mkE({ type: 'gunship', x, y: -40, hp: 18 * D.hp, hw: 28, hh: 20, score: 1000, drop, stopY: rand(130, 190) }); }
function spawnBomber(x) { mkE({ type: 'bomber', x, y: -60, hp: 60 * D.hp, hw: 52, hh: 30, score: 3000, drop: 'W', drop2: 'BOMB', drop3: 'S', fireB: 60 }); }
function spawnBoss() { mkE({ type: 'boss', x: W / 2, y: -90, hp: 900 * D.hp, hw: 92, hh: 48, score: 0, st: 0, spin: 0 }); }

// ================== 射击工具 ==================
function nearestPlayer(x, y) { let best = null, bd = 1e9; for (const p of players) if (p.alive) { const d = (p.x - x) ** 2 + (p.y - y) ** 2; if (d < bd) { bd = d; best = p; } } return best; }
function aimAng(x, y) { const p = nearestPlayer(x, y); return p ? Math.atan2(p.y - y, p.x - x) : PI / 2; }
function shot(x, y, a, sp, r = 4, col = '#ff4f7a') { eb.push({ x, y, vx: Math.cos(a) * sp * D.bs, vy: Math.sin(a) * sp * D.bs, r, col }); }
function fan(x, y, a, n, spread, sp, r, col) { n = Math.max(1, Math.round(n * DF.cnt)); for (let i = 0; i < n; i++) shot(x, y, a + (n > 1 ? (i / (n - 1) - 0.5) * spread : 0), sp, r, col); }

const onScreen = e => e.y > 10 && e.y < H - 30 && e.x > 0 && e.x < W;

// ================== 敌人行为 ==================
function updEnemy(e) {
  e.t++; if (e.flash > 0) e.flash--;
  const fr = D.fr, ox = e.x, oy = e.y;
  if (e.dying) { bossDying(e); return; }
  switch (e.type) {
    case 'fighter': {
      if (e.pat === 'sine') { e.y += e.vy; e.x = e.bx + Math.sin(e.t * 0.045) * e.amp; }
      else if (e.pat === 'swoop') { if (e.t > 25 && e.t < 95) e.ang += e.side * 0.045; e.x += Math.cos(e.ang) * e.sp; e.y += Math.sin(e.ang) * e.sp; }
      else { e.x += e.vx; e.y += e.vy; }
      if (--e.fireT <= 0) { e.fireT = rand(90, 170) / fr; if (onScreen(e) && e.y < H * 0.6 && Math.random() < 0.55 + 0.15 * loop) shot(e.x, e.y + 8, aimAng(e.x, e.y), 3); }
      break;
    }
    case 'tank': {
      e.y += e.vy; e.x += e.vx; if (e.x < 20 || e.x > W - 20) e.vx *= -1;
      e.ta = aimAng(e.x, e.y);
      if (--e.fireT <= 0) { e.fireT = rand(90, 140) / fr; if (onScreen(e) && e.y < H - 140) shot(e.x + Math.cos(e.ta) * 16, e.y + Math.sin(e.ta) * 16, e.ta, 2.6, 4, '#ffa040'); }
      break;
    }
    case 'turret': {
      e.y += e.vy; e.ta = aimAng(e.x, e.y);
      if (--e.fireT <= 0) { e.fireT = 120 / fr; if (onScreen(e) && e.y < H - 160) fan(e.x, e.y, e.ta, 3, 0.35, 2.4, 4, '#ffa040'); }
      break;
    }
    case 'gunship': {
      if (e.st === 0) { e.y += 2.2; if (e.y >= e.stopY) e.st = 1; }
      else if (e.st === 1) { e.t2++; e.x += Math.sin(e.t2 * 0.03) * 1.2; if (e.t2 > 220) e.st = 2; }
      else e.y += 2.4;
      if (--e.fireT <= 0) { e.fireT = 75 / fr; if (onScreen(e)) fan(e.x, e.y + 18, aimAng(e.x, e.y), 5, 0.8, 2.8, 4, '#ff70d0'); }
      break;
    }
    case 'bomber': {
      if (e.st === 0) { e.y += 0.9; if (e.y >= 160) e.st = 1; }
      else if (e.st === 1) { e.t2++; e.x += Math.sin(e.t2 * 0.015) * 0.8; if (e.t2 > 420) e.st = 2; }
      else e.y += 1.2;
      if (onScreen(e)) {
        if (--e.fireT <= 0) { e.fireT = 110 / fr; ring(e.x, e.y, 14, 2.2, e.t * 0.05, 5, '#7dff7a'); }
        if (--e.fireB <= 0) { e.fireB = 45 / fr; for (const s of [-30, 30]) fan(e.x + s, e.y + 10, aimAng(e.x + s, e.y), 3, 0.3, 3.4, 4, '#ff4f7a'); }
      }
      break;
    }

  if (e.type !== 'boss' && (e.y > H + 80 || e.x < -100 || e.x > W + 100 || (e.y < -140 && e.t > 120))) e.gone = true;
}
function updBoss(e) {
  const fr = D.fr;
  if (e.st === 0) { e.y += 1; if (e.y >= 140) { e.st = 1; e.t2 = 0; } return; }
  e.t2++;
  e.x = W / 2 + Math.sin(e.t2 * 0.008) * 120;
  e.y = 140 + Math.sin(e.t2 * 0.017) * 22;
  const r = e.hp / e.maxhp, every = n => e.t2 % Math.max(1, Math.round(n / fr)) === 0;
  const lx = e.x - 78, rx = e.x + 78, gy = e.y + 30;
  if (r > 0.66) {
    if (every(55)) fan(e.x, e.y + 40, aimAng(e.x, e.y + 40), 5, 0.6, 3, 5, '#ff4f7a');
    if (every(26)) { const sx = (e.t2 / 26 | 0) % 2 ? lx : rx; shot(sx, gy, aimAng(sx, gy), 4, 4, '#ffa040'); }
  } else if (r > 0.33) {
    if (every(5)) { e.spin += 0.23; shot(e.x, e.y + 10, e.spin, 2.5, 4, '#c070ff'); shot(e.x, e.y + 10, e.spin + PI, 2.5, 4, '#c070ff'); }
    if (every(90)) for (const sx of [lx, rx]) fan(sx, gy, aimAng(sx, gy), 3, 0.25, 4, 4, '#ff4f7a');

    if (every(9)) { const sx = Math.random() < 0.5 ? lx : rx; shot(sx, gy, aimAng(sx, gy) + rand(-0.15, 0.15), 4.4, 4, '#ffa040'); }
    if (every(140)) fan(e.x, e.y + 40, aimAng(e.x, e.y + 40), 9, 1.2, 2.8, 5, '#ff4f7a');

}
function bossDying(e) {

    spawnItem('W', e.x - 30, e.y); spawnItem('BOMB', e.x + 30, e.y); spawnItem('S', e.x, e.y + 20); for (let i = 0; i < 4; i++) spawnItem('MEDAL', e.x + rand(-60, 60), e.y + rand(-20, 20));

}
function damage(e, d, owner) {

  e.hp -= d; e.flash = 3;

}
function killEnemy(e, owner) {
  e.killer = owner;
  if (e.type === 'boss') { e.dying = 150; eb.length = 0; Snd.play('big'); const p = players[owner]; if (p) p.score += 50000 * (loop + 1); return; }
  e.dead = true;
  const p = players[owner]; if (p) p.score += e.score;
  const size = { fighter: 0.8, tank: 1, turret: 1.1, gunship: 1.4, bomber: 2.4 }[e.type] || 1;
  explode(e.x, e.y, size, e.ground);
  if (e.type === 'bomber') { for (let i = 0; i < 4; i++) explode(e.x + rand(-40, 40), e.y + rand(-20, 20), 1.2); Snd.play('big'); shake = 18; }
  else { Snd.play('boom'); shake = Math.max(shake, size > 1.2 ? 8 : 3); }
  if (e.score >= 1000) texts.push({ x: e.x, y: e.y, s: String(e.score), t: 60, col: '#fff' });
  if (e.drop) spawnItem(e.drop, e.x, e.y);
  if (e.drop2) spawnItem(e.drop2, e.x + 20, e.y);
  if (e.drop3) spawnItem(e.drop3, e.x - 20, e.y);

  if (!e.drop) { if (killCount % 30 === 0) spawnItem('W', e.x, e.y); else if (killCount % 22 === 0) spawnItem('S', e.x, e.y); else if (killCount % 45 === 0) spawnItem('BOMB', e.x, e.y); }
}

// ===== 武器（参考雷电原版：主武器颜色水晶 + 副武器导弹）=====
const MAIN_W = { red: { name: '散弹', col: '#ff8070', item: '#ff3a30' }, blue: { name: '激光', col: '#80d0ff', item: '#2e8bff' }, green: { name: '穿透波', col: '#8dff8a', item: '#24c840' } };
const MAIN_ORDER = ['red', 'blue', 'green'];
const SUB_W = { H: { name: '追踪导弹', col: '#d79bff', item: '#a040ff' }, M: { name: '核导弹', col: '#ffb060', item: '#ff8a10' } };
const SUB_ORDER = ['H', 'M'], MAX_WLV = 5, MAX_SLV = 4;
const itemColor = it => MAIN_ORDER[(it.c0 + Math.floor(it.t / 110)) % 3];
const itemSub = it => SUB_ORDER[(it.c0 + Math.floor(it.t / 110)) % 2];
// 捡到颜色不同的道具：直接换武器（不用答题）；颜色相同：答数学题升级；已满级：加分
function touchItem(p, it) {
  if (it.type === 'W') {
    const c = itemColor(it);
    if (p.wtype !== c) { p.wtype = c; texts.push({ x: it.x, y: it.y, s: `换成${MAIN_W[c].name} Lv${p.wlv}`, t: 70, col: MAIN_W[c].col }); Snd.play('power'); }
    else if (p.wlv >= MAX_WLV) { p.score += 5000; texts.push({ x: it.x, y: it.y, s: '满级 5000', t: 50, col: '#ffe060' }); Snd.play('item'); }
    else openMathQuiz(p, it);
  } else if (it.type === 'S') {
    const c = itemSub(it);
    if (p.sub !== c) { p.sub = c; texts.push({ x: it.x, y: it.y, s: `获得${SUB_W[c].name} Lv${p.slv}`, t: 70, col: SUB_W[c].col }); Snd.play('power'); }
    else if (p.slv >= MAX_SLV) { p.score += 5000; texts.push({ x: it.x, y: it.y, s: '满级 5000', t: 50, col: '#ffe060' }); Snd.play('item'); }
    else openMathQuiz(p, it);
  } else pickItem(p, it);
}
function pickItem(p, it) {
  if (it.type === 'W') {
    p.wlv = Math.min(MAX_WLV, p.wlv + 1); const m = MAIN_W[p.wtype];
    texts.push({ x: it.x, y: it.y, s: `${m.name} Lv${p.wlv}`, t: 60, col: m.col }); Snd.play('power');
  } else if (it.type === 'S') {
    p.slv = Math.min(MAX_SLV, p.slv + 1); const m = SUB_W[p.sub];
    texts.push({ x: it.x, y: it.y, s: `${m.name} Lv${p.slv}`, t: 60, col: m.col }); Snd.play('power');

    p.bombs = Math.min(7, p.bombs + 1); texts.push({ x: it.x, y: it.y, s: '炸弹+1', t: 50, col: '#90ff90' }); Snd.play('item');
  } else {
    const v = 1000 * (loop + 1); p.score += v; texts.push({ x: it.x, y: it.y, s: String(v), t: 50, col: '#ffe060' }); Snd.play('item');

}

// ================== 玩家 ==================
function pbul(p, x, y, vx, vy, dmg, kind, w = 6, h = 14) { const b = { owner: p.id, x, y, vx, vy, dmg, kind, w, h }; pb.push(b); return b; }
function subShoot(p) {
  const lv = p.slv;
  if (p.sub === 'H') { // 追踪导弹：自动拐弯追最近的敌人
    p.subCd = [0, 40, 32, 30, 24][lv];
    const n = lv >= 3 ? 4 : 2;
    for (let i = 0; i < n; i++) { const s = i % 2 ? 1 : -1, a = -PI / 2 + s * (0.5 + 0.35 * Math.floor(i / 2));
      const b = pbul(p, p.x + s * 12, p.y, Math.cos(a) * 5, Math.sin(a) * 5, 1.4, 'homing', 8, 8); b.life = 130; b.sp = 6.5; }
  } else { // 核导弹：直线飞行、越飞越快，命中爆炸波及周围
    p.subCd = [0, 38, 30, 26, 22][lv];
    let xs; if (lv >= 4) xs = [-16, -8, 8, 16]; else if (lv >= 2) xs = [-12, 12]; else { p.subSide = -p.subSide; xs = [p.subSide * 12]; }
    for (const dx of xs) { const b = pbul(p, p.x + dx, p.y - 6, 0, -3, 3.2, 'nuke', 8, 16); b.splash = 1.6 + lv * 0.3; }
  }
}
function playerShoot(p) {
  const lv = p.wlv;
  if (p.wtype === 'red') {
    p.fireCd = 6;
    pbul(p, p.x - 6, p.y - 16, 0, -12, 1, 'red'); pbul(p, p.x + 6, p.y - 16, 0, -12, 1, 'red');
    const angs = [7, 15, 24, 33].slice(0, lv - 1);
    for (const a of angs) for (const s of [-1, 1]) { const r = a * s * PI / 180; pbul(p, p.x + s * 9, p.y - 10, Math.sin(r) * 12, -Math.cos(r) * 12, 1, 'red'); }
    Snd.play('shot');
  } else if (p.wtype === 'green') { // 穿透波：宽幅波动弹，可以穿过敌人继续飞
    p.fireCd = 9;
    pbul(p, p.x, p.y - 20, 0, -10, 2.1 + lv * 0.45, 'green', 26 + lv * 8, 10).pierce = new Set();
    if (lv >= 4) for (const s of [-1, 1]) pbul(p, p.x + s * 10, p.y - 14, s * 2.6, -9.5, 1 + lv * 0.25, 'green', 22, 10).pierce = new Set();
    Snd.play('laser');
  } else {
    p.fireCd = 4;
    pbul(p, p.x, p.y - 26, 0, -17, 1 + lv * 0.45, 'blue', 4 + lv * 2, 36);
    if (lv >= 3) for (const s of [-1, 1]) pbul(p, p.x + s * 14, p.y - 12, s * (lv >= 5 ? 0.6 : 0), -16, 0.5 + lv * 0.15, 'blue', 4, 26);
    Snd.play('laser');
  }
}
function useBomb(p) {
  p.bombs--; p.bombCd = 40; p.inv = Math.max(p.inv, 100);
  bombsFx.push({ x: p.x, y: p.y - 120, t: 0, owner: p.id, col: p.color });
  eb.length = 0; shake = 20; flash = 0.8; Snd.play('bomb');
}
function hurtPlayer(p) {
  if (!p.alive || p.inv > 0 || p.hurtT > 0) return;
  p.hp--; p.hurtT = 30;
  for (let i = 0; i < 8; i++) { const a = rand(0, TAU), sp = rand(1, 3); parts.push({ type: 'spark', x: p.x, y: p.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 14, max: 14, size: 2, col: '#ffd040' }); }
  shake = Math.max(shake, 5); Snd.play('ouch');
  if (p.hp <= 0) { p.hp = 0; killPlayer(p); }
}
function killPlayer(p) {
  if (p.inv > 0 || !p.alive) return;
  p.alive = false; p.lives--; p.respawnT = 100;
  explode(p.x, p.y, 2); for (let i = 0; i < 3; i++) explode(p.x + rand(-20, 20), p.y + rand(-20, 20), 1);
  shake = 22; Snd.play('die');
  if (p.wlv > 1) spawnItem('W', p.x, p.y - 40);
  if (p.sub && p.slv > 1) spawnItem('S', p.x + 30, p.y - 40);
  p.wlv = 1; p.slv = 1;
}
function updPlayer(p) {
  if (!p.alive || p.entering > 0) { drag.dx = drag.dy = 0; bombReq = false; }
  if (!p.alive) {
    if (p.lives > 0 && --p.respawnT <= 0) {
      p.alive = true; p.x = mode === 1 ? W / 2 : (p.id === 0 ? W * 0.33 : W * 0.67); p.y = H + 30; p.inv = 170; p.hp = MAXHP; p.hurtT = 0; p.bombs = Math.max(p.bombs, 3); p.entering = 40;
    }
    return;
  }
  const c = CTRL[p.id];
  if (p.entering > 0) { p.entering--; p.y -= 3; if (p.inv > 0) p.inv--; return; }
  let dx = (held(c.right) ? 1 : 0) - (held(c.left) ? 1 : 0), dy = (held(c.down) ? 1 : 0) - (held(c.up) ? 1 : 0);
  if (dx && dy) { dx *= 0.7071; dy *= 0.7071; }
  const sp = 4.6;
  let mx = dx * sp, my = dy * sp;
  if (drag.dx || drag.dy) { mx += drag.dx * TOUCH_SENS; my += drag.dy * TOUCH_SENS; drag.dx = drag.dy = 0; }
  p.x = clamp(p.x + mx, 16, W - 16); p.y = clamp(p.y + my, 60, H - 26);
  p.bank += (clamp(mx / 5, -1, 1) - p.bank) * 0.2;
  if (p.inv > 0) p.inv--;
  if (p.hurtT > 0) p.hurtT--;
  if (p.fireCd > 0) p.fireCd--;
  if (p.bombCd > 0) p.bombCd--;
  if (p.fireCd <= 0) playerShoot(p); // 全自动射击
  if (p.sub && --p.subCd <= 0) subShoot(p);
  if ((hit(c.bomb) || bombReq) && p.bombs > 0 && p.bombCd <= 0) useBomb(p);
  bombReq = false;
}

const SPARK = ['#fff6b0', '#ffd040', '#ff9020', '#ff5010'];
function explode(x, y, s = 1, ground = false) {
  const n = Math.floor(16 * s);
  for (let i = 0; i < n; i++) { const a = rand(0, TAU), sp = rand(0.5, 5) * Math.sqrt(s); const l = rand(18, 40); parts.push({ type: 'spark', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: l, max: l, size: rand(1.5, 3.5) * Math.min(s, 1.6), col: SPARK[(Math.random() * 4) | 0] }); }
  parts.push({ type: 'flash', x, y, life: 16, max: 16, size: 26 * s });
  for (let i = 0; i < 4 * s; i++) { const l = rand(30, 55); parts.push({ type: 'smoke', x: x + rand(-8, 8) * s, y: y + rand(-8, 8) * s, vx: rand(-0.5, 0.5), vy: rand(-0.6, 0.3), life: l, max: l, size: rand(6, 12) * s }); }
  for (let i = 0; i < 3 * s; i++) { const a = rand(0, TAU), sp = rand(1, 4); parts.push({ type: 'debris', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 40, max: 40, size: rand(2, 4), rot: rand(0, TAU) }); }
  if (ground) scorch.push({ x, y, r: 16 * s, life: 400 });
}
function updParts() {
  for (const p of parts) {
    p.life--;
    if (p.type === 'spark') { p.x += p.vx; p.y += p.vy; p.vx *= 0.94; p.vy *= 0.94; }
    else if (p.type === 'smoke') { p.x += p.vx; p.y += p.vy + 0.4; p.size *= 1.015; }
    else if (p.type === 'debris') { p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.rot += 0.2; }
  }
  parts = parts.filter(p => p.life > 0);
  if (parts.length > 1500) parts.splice(0, parts.length - 1500);
  for (const s of scorch) { s.y += SCROLL; s.life--; }
  scorch = scorch.filter(s => s.life > 0 && s.y < H + 40);
  for (const t of texts) { t.t--; t.y -= 0.6; }
  texts = texts.filter(t => t.t > 0);
}
function updClouds() { for (const c of clouds) { c.y += c.s; if (c.y > H + 100) { c.y = rand(-260, -100); c.x = rand(0, W); c.w = rand(60, 140); } } }

    if (b.hit) continue;
    for (const e of enemies) {

        const sc = { red: '#ffb070', blue: '#bfefff', green: '#b0ffb0', homing: '#e0b0ff', nuke: '#ffd080' }[b.kind];
        parts.push({ type: 'spark', x: b.x, y: b.y - 4, vx: rand(-1.5, 1.5), vy: rand(-2, 0), life: 10, max: 10, size: 2, col: sc });
        if (b.kind === 'nuke') { // 爆炸波及

  eb = eb.filter(b => b.x > -20 && b.x < W + 20 && b.y > -20 && b.y < H + 20);
  for (const p of players) {
    if (!p.alive || p.entering > 0) continue;
    for (const b of eb) { const dx = b.x - p.x, dy = b.y - p.y, r = b.r + 3; if (dx * dx + dy * dy < r * r) { if (p.inv <= 0) { b.dead = true; hurtPlayer(p); } break; } }

    for (const e of enemies) {
      if (e.ground || e.dead || e.dying || e.gone) continue;
      if (Math.abs(p.x - e.x) < e.hw * 0.7 + 4 && Math.abs(p.y - e.y) < e.hh * 0.7 + 4) { if (p.inv <= 0 && p.hurtT <= 0 && e.type !== 'boss') damage(e, 6, p.id); hurtPlayer(p); break; }
    }

    it.t++; it.x += it.vx; if (it.x < 14 || it.x > W - 14) it.vx *= -1;
    it.y += it.vy;
    if (it.t < 520) { if (it.y > H - 40) it.vy = -Math.abs(it.vy); if (it.y < 60 && it.t > 60) it.vy = Math.abs(it.vy); }
    for (const p of players) if (!quiz && p.alive && !it.taken && Math.hypot(p.x - it.x, p.y - it.y) < 24) { it.taken = true; touchItem(p, it); }
  }

  // 炸弹
  for (const bf of bombsFx) {
    bf.t++;

      for (const e of enemies) if (e.y > -e.hh && e.y < H + e.hh) damage(e, e.type === 'boss' ? 1.1 : 2.5, bf.owner);

    }

  enemies = enemies.filter(e => !e.dead && !e.gone);
  updParts();

  if (clearT > 0 && --clearT === 0) { loop++; startStage(); }

// ================== HUD ==================

  ctx.fillStyle = grd; ctx.fillRect(0, 0, W, 48);

}

// ================== 渲染 ==================
function render() {
  ctx.setTransform(SC, 0, 0, SC, 0, 0);
  btns = []; UIY = 0;
  ctx.save();
  if (shake > 0) ctx.translate(rand(-shake, shake) * 0.5, rand(-shake, shake) * 0.5);
  drawBG();
  for (const s of scorch) { ctx.fillStyle = `rgba(20,15,10,${Math.min(0.5, s.life / 400)})`; ctx.beginPath(); ctx.ellipse(s.x, s.y, s.r, s.r * 0.8, 0, 0, TAU); ctx.fill(); }
  if (state !== 'title') {
    for (const e of enemies) if (e.ground) drawEnemy(e);
    items.forEach(drawItem);
  }
  drawClouds();
  if (state !== 'title') {
    for (const e of enemies) if (!e.ground) drawEnemy(e);
    pb.forEach(drawPB);
    players.forEach(drawPlayer);
    drawParts();
    drawBombs();
    eb.forEach(drawEB);
  } else drawParts();
  ctx.restore();
  if (flash > 0) { ctx.fillStyle = `rgba(255,250,230,${flash * 0.6})`; ctx.fillRect(0, 0, W, H); }
  if (state === 'title') drawTitle();
  else {
    drawHUD(); drawOverlay();
    if (state === 'gameover') drawGameOver();
    if (quiz && state === 'play') drawQuiz();
  }
  if (locked) { btns = []; UIY = 0; drawLock(); }
}

// ================== 主循环 (固定60帧逻辑) ==================
let last = performance.now(), acc = 0;
const STEP = 1000 / 60;
function tick(now) {
  acc += Math.min(100, now - last); last = now;
  let n = 0;
  while (acc >= STEP && n < 5) { update(); pressed = {}; acc -= STEP; n++; }
  render();
  requestAnimationFrame(tick);
}
addEventListener('resize', resize); addEventListener('orientationchange', () => setTimeout(resize, 200));
if (window.visualViewport) visualViewport.addEventListener('resize', resize);
resize();
requestAnimationFrame(tick);
// 离线：注册 Service Worker（相对路径，支持 GitHub Pages 子目录）
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
